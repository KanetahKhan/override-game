name: JavaFX graphics build
on:
  pull_request:
    paths:
      - 'src/main/java/com/override/chapter1/**'
      - 'src/test/java/com/override/chapter1/**'
      - 'scripts/test-minimap.sh'
      - 'pom.xml'
      - '.github/workflows/graphics-build.yml'
permissions:
  contents: read
jobs:
  compile:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '26'
          cache: maven
      - name: Compile frontend and check the live minimap
        run: xvfb-run -a bash scripts/test-minimap.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: classroom-minimap-preview
          path: target/minimap-preview/
