name: JavaFX graphics build
on:
  pull_request:
    paths:
      - 'src/main/java/com/override/chapter1/**'
      - 'pom.xml'
      - '.github/workflows/graphics-build.yml'
permissions:
  contents: read
jobs:
  compile:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '26'
          cache: maven
      - name: Compile JavaFX frontend
        run: mvn --batch-mode --no-transfer-progress -DskipTests compile
