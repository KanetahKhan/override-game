name: Opening menu and classroom film
on:
  pull_request:
    paths:
      - 'src/main/java/com/override/shared/ui/**'
      - 'src/test/java/com/override/shared/ui/OpeningVisualSmoke.java'
      - 'src/main/resources/Assets_Characters/**'
      - 'scripts/test-opening.sh'
      - '.github/workflows/opening-preview.yml'
permissions:
  contents: read
jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '26'
          cache: maven
      - name: Compile, test and record actual presentation components
        run: xvfb-run -a bash scripts/test-opening.sh --video
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: classroom-opening-preview
          path: target/opening-preview/
          if-no-files-found: warn
