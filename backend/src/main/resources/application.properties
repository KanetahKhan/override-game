# ===== Override Backend =====

spring.application.name=override-backend
server.port=8080

# ----- H2 (development) -----
spring.datasource.url=jdbc:h2:file:./data/override-db
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.h2.console.path=/h2

# ----- MySQL (uncomment for production) -----
# spring.datasource.url=jdbc:mysql://localhost:3306/override_db?useSSL=false&serverTimezone=UTC
# spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
# spring.datasource.username=root
# spring.datasource.password=your_password

# ----- JPA -----
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# ----- JWT -----
app.jwt.secret=OverrideGameSecretKeyChangeThisInProductionMakeItAtLeast256Bits!!
app.jwt.expiration-ms=86400000
